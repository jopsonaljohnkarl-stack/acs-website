name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE: /${{ github.event.repository.name }}
      # Portfolio credit bar, added to this Pages copy only.
      BANNER: '<p style="margin:0;min-height:32px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--wp--preset--color--structure,#0F172A);color:#fff;font:600 .7rem/1 var(--wp--preset--font-family--code,ui-monospace,monospace);letter-spacing:.08em;text-transform:uppercase"><span style="opacity:.72;font-weight:500">Site by</span> John Jopson</p>'
    steps:
      - uses: actions/checkout@v4
      # The static showcase uses root-relative URLs. Pages serves this repo
      # under a sub-path, so prefix them in a copy; the source stays untouched.
      # WordPress emits both single- and double-quoted attributes.
      - name: Assemble site
        run: |
          cp -r showcase/site _site
          find _site -type f -name '*.html' -print0 \
            | xargs -0 sed -i -E "s#(href|src|action|poster)=([\"'])/([^/\"'])#\1=\2${BASE}/\3#g; s#(href|action)=([\"'])/([\"'])#\1=\2${BASE}/\3#g"
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i -E "s#([\"'(=, ])/(wp-content|wp-includes)/#\1${BASE}/\2/#g"
          # Same intent as vercel.json's X-Robots-Tag: keep this copy out of search.
          find _site -type f -name '*.html' -print0 \
            | xargs -0 sed -i -E '0,/<head[^>]*>/s##&<meta name="robots" content="noindex, nofollow, noarchive">#'
          find _site -type f -name '*.html' -print0 \
            | xargs -0 sed -i -E "0,/<body[^>]*>/s||&${BANNER}|"
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
