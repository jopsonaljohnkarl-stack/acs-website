name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      # The static showcase uses root-relative URLs. Pages serves this repo
      # under a sub-path, so prefix them in a copy; the source stays untouched.
      - name: Assemble site
        run: |
          cp -r showcase/site _site
          find _site -type f -name '*.html' -print0 \
            | xargs -0 sed -i -E "s#(href|src|action|poster)=\"/([^/\"])#\1=\"${BASE}/\2#g; s#(href|action)=\"/\"#\1=\"${BASE}/\"#g"
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i -E "s#([\"'(=, ])/wp-content/#\1${BASE}/wp-content/#g"
          # Same intent as vercel.json's X-Robots-Tag: keep this copy out of search.
          find _site -type f -name '*.html' -print0             | xargs -0 sed -i -E '0,/<head[^>]*>/s##&<meta name="robots" content="noindex, nofollow, noarchive">#'
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
