<!--
  The document's title block.

  ⚠⚠ ONE ROW, NOT TWO, SINCE 2026-08-20. It was a masthead row above a
  navigation row and it measured **213 pixels tall** - against a 80px cap and
  eating a quarter of a 900px viewport on every page of the site. It also
  pushed the home page's hero out of the first screen. Measured, not guessed.

  The two-row masthead was the document world applied to the one surface that
  is not the document: a reader arrives to read the page, not the letterhead.

  ⚠ THE NAVIGATION BLOCK CARRIES NO `ref`, DELIBERATELY. It used to carry
  {"ref":19}, a database row id, written into a file that is in git and
  restored onto a database where that id does not exist. Without a ref the
  block resolves the most recently published navigation menu, and
  `content/seed.php` guarantees that is `ACS main` by creating it and removing
  the placeholder one WordPress generates for itself.

  ⚠ The six menu items are placeholders. The real six are in the sitemap
  diagram that did not survive text extraction; ask Janet for them. They read
  left to right in the order a buyer asks questions: how does this work, who
  can I hire, do you understand my industry, what will it cost, can I trust you.

  ⚠ The tagline beside the title is unapproved (People and Brand 3.0, none
  selected) and it hides below 1200px, where the navigation needs the room.
-->
