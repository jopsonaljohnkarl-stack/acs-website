  LEGAL PAGE: Privacy Policy, Terms, Cookies, Pricing Disclaimer. (Candidate
  Privacy has its own designed layout, on content-page.)

  Layout: the "first version" board of Janet Biag's legal mockup (claude.ai
  artifact AjLNRZgK4ivmHQKeyAq2DV), which she asked for on each of these four
  pages on Asana, 2 Oct 2026 ("please use this mockup ... first version"): a
  grey header band (eyebrow, title, last-updated line), then the numbered
  sections beside a sticky "On this page" list built from the page's h2s.
  Her board's "Applying for a role?" box belongs to the candidate notice and
  is left out here. Bracketed placeholders are highlighted, and the document's
  LEGAL DRAFT paragraph (class acs-legal-draft) shows as an amber notice.
  The markers are filled in resources.php (acs_legal_*).

  ⚠⚠ NONE OF THESE PUBLISHES WITHOUT THE AUSTRALIAN SOLICITOR. Register row
  Legal 1.0 names nobody, and the proposal writes these last on purpose because
  they run on the reviewer's timeline, which is the most common cause of a
  delayed launch.

  ⚠ THE PRIVACY POLICY IS ALSO A DEPENDENCY OF THE FORMS. Every enquiry form's
  consent checkbox links to it, so this page blocks lead capture going live as
  well as the legal set.

  ⚠ Cross-border disclosure (Delivery Model 6.0) lives in ONE reviewed place.
  The Data Security page carries a plain-English summary that links here; it
  does not restate the legal statement in its own words.

  ⚠ The "Last updated" placeholder stays a placeholder in this file. The date
  comes from the option acs_legal_updated (resources.php), one setting for all
  five legal pages, set on launch day once Dan has decided to publish the legal
  wording (with or without his adviser's review). Never type a date here.
-->
