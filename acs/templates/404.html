<!--
  404: PAGE NOT FOUND.

  Added 6 November 2026 after the interface check found the theme had no 404
  template: WordPress fell back to index.html, whose post loop is empty on a
  404, so a visitor on a wrong address saw header, white space, footer, and
  nothing to click. Unknown paths answer 404 by policy (REDIRECTS.md: the old
  site was spam-injected, so nothing is blanket-redirected to Home); this page
  is what that policy shows. The same markup as a composed hero (compose-
  industry.py EYEBROW, H1, SEP, P_LARGE, buttons), no photograph, no claims.
  Wording is the builder's, not from a client document: four short lines.
  Deploy: upload this one file to wp-content/themes/acs/templates/ (File
  Manager); block themes pick 404.html up by the template hierarchy, nothing
  to register in theme.json.
-->
